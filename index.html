<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>黄石市民营企业贷款产品智能匹配系统</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <div class="hero">
      <div class="hero-icon">🏦</div>
      <div class="hero-title">民营企业贷款产品<br>智能匹配系统</div>
      <div class="hero-desc">基于您的企业情况和融资需求<br>智能匹配最适合的银行贷款产品</div>
    </div>

    <div class="card">
      <div class="title-md" style="margin-bottom: 16px;">核心功能</div>
      <div class="feature-list">
        <div class="feature-item">
          <div class="feature-icon">📊</div>
          <div class="feature-text">五级漏斗<br>精准匹配</div>
        </div>
        <div class="feature-item">
          <div class="feature-icon">💰</div>
          <div class="feature-text">87款贷款<br>产品覆盖</div>
        </div>
        <div class="feature-item">
          <div class="feature-icon">⚡</div>
          <div class="feature-text">1分钟完成<br>智能测评</div>
        </div>
        <div class="feature-item">
          <div class="feature-icon">📞</div>
          <div class="feature-text">一键拨打<br>客户经理</div>
        </div>
      </div>

      <div class="start-btn-wrap">
        <button class="btn-primary" onclick="startTest()">开始智能匹配</button>
      </div>
    </div>

    <div class="card">
      <div class="title-md" style="margin-bottom: 12px;">使用说明</div>
      <div class="tip-item" style="font-size: 13px; color: #666; line-height: 1.8; margin-bottom: 8px;">
        1. 如实填写企业基本信息和融资需求
      </div>
      <div class="tip-item" style="font-size: 13px; color: #666; line-height: 1.8; margin-bottom: 8px;">
        2. 系统根据五级漏斗规则智能匹配
      </div>
      <div class="tip-item" style="font-size: 13px; color: #666; line-height: 1.8; margin-bottom: 8px;">
        3. 查看优先推荐和备选方案，直接联系银行
      </div>
      <div class="tip-item" style="font-size: 13px; color: #666; line-height: 1.8;">
        4. 最终贷款额度、利率以银行实际审批为准
      </div>
    </div>
  </div>

  <script src="js/products.js"></script>
  <script src="js/matcher.js"></script>
  <script src="js/common.js"></script>
  <script>
    function startTest() {
      Store.remove('formData');
      Store.remove('matchResult');
      window.location.href = 'questionnaire.html';
    }
  </script>
</body>
</html>
