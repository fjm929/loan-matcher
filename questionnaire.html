<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>填写问卷 - 贷款产品智能匹配</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="title-md" style="margin-bottom: 8px;">企业信息填报</div>
      <div style="font-size: 13px; color: #999; margin-bottom: 24px;">请如实填写以下信息，我们将为您智能匹配最合适的贷款产品</div>

      <!-- 第1题：企业/经营主体名称（填空） -->
      <div class="form-item">
        <div class="form-label"><span class="required">*</span>1. 企业 / 经营主体名称</div>
        <input class="form-input" id="company_name" placeholder="请输入企业或经营主体全称" />
      </div>

      <!-- 第2题：是否企业申请贷款（单选） -->
      <div class="form-item">
        <div class="form-label"><span class="required">*</span>2. 是否企业申请贷款？</div>
        <div class="option-group" id="is_enterprise_group"></div>
      </div>

      <!-- 第3题：所属行业（单选+S项填空） -->
      <div class="form-item">
        <div class="form-label"><span class="required">*</span>3. 企业（个体工商户）所属行业</div>
        <div class="option-group" id="industry_group"></div>
        <div class="form-item" id="industry_other_wrap" style="display:none; margin-top:12px; margin-bottom:0;">
          <input class="form-input" id="industry_other" placeholder="请填写具体行业" />
        </div>
      </div>

      <!-- 第4题：成立年限（单选） -->
      <div class="form-item">
        <div class="form-label"><span class="required">*</span>4. 企业（个体工商户）成立年限是：</div>
        <div class="option-group" id="years_group"></div>
      </div>

      <!-- 第5题：上一年度营业收入（单选） -->
      <div class="form-item">
        <div class="form-label"><span class="required">*</span>5. 上一年度营业收入：</div>
        <div class="option-group" id="revenue_group"></div>
      </div>

      <!-- 第6题：计划申请融资金额（单选） -->
      <div class="form-item">
        <div class="form-label"><span class="required">*</span>6. 计划申请融资金额：</div>
        <div class="option-group" id="loan_amount_group"></div>
      </div>

      <!-- 第7题：计划贷款使用年限（单选） -->
      <div class="form-item">
        <div class="form-label"><span class="required">*</span>7. 计划贷款使用年限：</div>
        <div class="option-group" id="loan_term_group"></div>
      </div>

      <!-- 第8题：可接受的贷款类型（多选） -->
      <div class="form-item">
        <div class="form-label"><span class="required">*</span>8. 可接受的贷款类型（可多选）：</div>
        <div class="option-group" id="guarantee_types_group"></div>
        <div class="selected-hint" id="guarantee_hint" style="display:none;"></div>
      </div>

      <!-- 第9题：是否为科技型企业（单选） -->
      <div class="form-item">
        <div class="form-label"><span class="required">*</span>9. 是否为科技型企业：</div>
        <div class="option-group" id="is_tech_group"></div>
      </div>
    </div>
  </div>

  <!-- 底部按钮 -->
  <div class="bottom-nav">
    <div class="nav-right" style="flex:1; padding:0;">
      <button class="btn-primary" id="submit_btn" onclick="submitForm()">开始智能匹配</button>
    </div>
  </div>

  <script src="https://static.cloudbase.tencent.com/js/sdk/cloudbase.js"></script>
  <script src="js/products.js"></script>
  <script src="js/matcher.js"></script>
  <script src="js/common.js"></script>
  <script src="js/cloudbase.js"></script>
  <script src="js/questionnaire.js"></script>
</body>
</html>
